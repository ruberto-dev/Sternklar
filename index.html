<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0e1a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sternklar" />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <title>Sternklar</title>
    <script>
      // Theme vor dem ersten Rendern setzen, damit nichts hell aufblitzt
      try {
        if (localStorage.getItem('sternklar-theme') === 'rot') {
          document.documentElement.dataset.theme = 'rot';
        }
      } catch (e) {
        /* localStorage nicht verfuegbar — dunkles Standard-Theme gilt */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
